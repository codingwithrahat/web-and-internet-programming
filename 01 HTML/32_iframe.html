<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe</title>
</head>
<body>
    <iframe src="https://maps.google.com/maps?q=conference+venue&output=embed" width="100%" height="300" style="border:0" loading="lazy" allowfullscreen></iframe>

    <!-- style="border:0" Removes the iframe border. -->

    <!-- allowfullscreen Allows the embedded map to open in full-screen mode. -->

    <!-- loading="lazy"	Loads the map only when it is near the visible area, improving initial page loading performance. -->

</body>
</html>
