<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
</head>
<body>

    <!-- absoulate link -->
    <a href="https://pothik.codingwithrahat.me">Pothik</a>

    <hr>

    <!-- relative link -->
    <!-- it point to another html file in the same directory -->
    <a href="10_special_char.html" target="_blank">Another html in same website</a>

    <p>Another html in same website</p>

    <hr>

    <!-- Link to a file in a subfolder -->
    <p>Link to a file in a subfolder</p>
    <a href="subfolder/index.html" target="_blank">Just an example</a>

    <hr>
    <p>Link to a file one folder up</p>
    <a href="../index.html" target="_blank">Just an example</a>

</body>
</html>
