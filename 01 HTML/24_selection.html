
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selection</title>
</head>
<body>

    <!-- Select Dropdown -->
    <label for="option">Choose an option:</label>
    <select id="option" name="option">
        <option value="option1">Option 1</option>
        <option value="option2">Option 2</option>
        <option value="option3">Option 3</option>
    </select>

    <!-- Radio Buttons -->
    <p>Select your attendance mode:</p>

    <input type="radio" id="online" name="mode" value="online">
    <label for="online">Online</label>

    <input type="radio" id="offline" name="mode" value="offline">
    <label for="offline">Offline</label>

    <input type="radio" id="hybrid" name="mode" value="hybrid">
    <label for="hybrid">Hybrid</label>

    <!-- Checkboxes -->
    <p>Select your interests:</p>

    <input type="checkbox" id="cpp" name="interest" value="cpp">
    <label for="cpp">C++</label>

    <input type="checkbox" id="java" name="interest" value="java">
    <label for="java">Java</label>

    <input type="checkbox" id="python" name="interest" value="python">
    <label for="python">Python</label>

    <input type="checkbox" id="js" name="interest" value="js">
    <label for="js">JavaScript</label>


    <!-- all this are use in forms  -->

</body>
</html>
