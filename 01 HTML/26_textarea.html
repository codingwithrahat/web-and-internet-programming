<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textarea</title>
</head>
<body>
    <label for="message">Enter your message:</label>
    <textarea id="message" name="message" rows="5" cols="40" minlength="20" maxlength="500" placeholder="Share your expectations in 20 to 500 characters"></textarea>

    <!-- textarea can take multiple lines of text input from the user. It is often used for longer text inputs, such as comments, feedback, or messages. The "rows" attribute specifies the number of visible text lines, while the "cols" attribute specifies the visible width of the textarea in character columns. -->
</body>
</html>
