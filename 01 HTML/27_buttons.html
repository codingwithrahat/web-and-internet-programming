<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
</head>
<body>

    <!-- Button -->
    <button type="button">Click Me!</button>

    <!-- Submit Button -->
    <form action="https://pothik.codingwithrahat.me" method="post">
        <input type="submit" value="Submit Form">
    </form>

    <!-- Reset Button -->
    <form>
        <input type="reset" value="Reset Form">
    </form>
    
</body>
</html>
