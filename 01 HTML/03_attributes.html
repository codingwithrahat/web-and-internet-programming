<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attributes</title>
</head>
<body>

    <!-- here alt and src is attributes
    is give extra information about the element. -->
    <img src="image.jpg" alt="An image">

    <a href="https://www.google.com" target="_blank">Google</a>
    <!-- _blank is an attribute that opens the link in a new tab. -->

    <input type="email", id="email" name="email" required>
    <!-- required is an attribute that makes the input field mandatory to fill before submitting the form. -->
    
    
</body>
</html>
