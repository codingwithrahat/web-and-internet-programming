<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure & Figcaption</title>
</head>
<body>

    <figure>
        <img src="image.jpg" alt="A beautiful image" width="500" height="300">
        <figcaption>This is a beautiful image</figcaption>
    </figure>

    when need a caption for an image, we can use figcaption tag. It is used to provide a caption or description for the content of the figure element. The figcaption element is typically placed as the first or last child of the figure element, and it can contain text, images, or other HTML elements.
    
</body>
</html>
