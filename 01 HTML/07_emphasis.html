<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emphasis</title>
</head>
<body>
    <p>
        This is a paragraph with <em>emphasized text</em> and <strong>strongly emphasized text</strong>.
    </p>

    <p>this is a paragraph with <i>italic text</i> and <b>bold text</b>.</p>

    <!-- strong for important and b for bold text but not important. -->
    <!-- em for emphasis and i for italic -->

    
</body>
</html>
