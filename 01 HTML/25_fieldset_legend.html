<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fieldset & Legend</title>
</head>
<body>
    

    <!-- use of fieldset and legend tag in html -->
    <!-- <it creates a box around the form elements and provides a caption for the group of elements. -->
    <fieldset>
        <legend>Select your attendance mode:</legend>

        <input type="radio" id="online" name="mode" value="online">
        <label for="online">Online</label>

        <input type="radio" id="offline" name="mode" value="offline">
        <label for="offline">Offline</label>

        <input type="radio" id="hybrid" name="mode" value="hybrid">
        <label for="hybrid">Hybrid</label>

    </fieldset>


</body>
</html>
