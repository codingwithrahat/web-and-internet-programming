<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested List</title>
</head>
<body>
    <ul>
        <li>Item 1
            <ol>
                <li>Sub-item 1.1</li>
                <li>Sub-item 1.2</li>
            </ol>
        </li>
        <li>Item 2
            <ol>
                <li>Sub-item 2.1</li>
                <li>Sub-item 2.2</li>
            </ol>
        </li>
    </ul>
</body>
</html>
